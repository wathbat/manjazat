<!doctype html>
<html lang="ar" dir="rtl">
<head>

<link rel="icon" href="icon-192.png">

<title>منجزات العائلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1208;--ink2:#2c1f0a;--gold:#c49a3c;--gold-l:#e8c97a;--gold-p:#fdf6e3;
  --cream:#faf7f0;--cream2:#f3ede0;--line:rgba(196,154,60,.22);--muted:#7a6f5c;
  --green:#2d6a45;--green-p:#e4f2e9;--red:#a33a3a;--red-p:#fbeceb;--amber:#9a5b12;--amber-p:#fdf0de;
  --shadow:0 2px 14px rgba(26,18,8,.07);--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
.app{max-width:560px;margin:0 auto;padding:0 14px 150px;min-height:100vh}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--cream);z-index:20}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:17px;line-height:1.2}
.top .who span{font-size:12px;color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:16px;color:var(--muted)}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav button .i{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--ink)}
.nav button.on .i{filter:none;opacity:1}
.nav button.on:after{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.nav .dot{position:absolute;top:6px;margin-right:22px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;line-height:17px;padding:0 4px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 .sp{flex:1}
.card h3 small{font-size:12px;font-weight:600;color:var(--muted)}
.hero{background:linear-gradient(145deg,var(--ink),var(--ink2));color:#fff;border-radius:22px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;top:-70px;left:-70px;width:220px;height:220px;background:radial-gradient(circle,rgba(196,154,60,.25),transparent 70%)}
.hero .row{display:flex;align-items:center;gap:16px;position:relative}
.hero .big{font-size:13px;color:rgba(255,255,255,.6)}
.hero .sar{font-size:28px;font-weight:800;color:var(--gold-l);line-height:1.2}
.hero .sar small{font-size:14px;color:rgba(255,255,255,.55);font-weight:600}
.hero .pts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;position:relative}
.hero .pill{background:rgba(255,255,255,.08);border:1px solid rgba(232,201,122,.25);border-radius:20px;padding:3px 12px;font-size:12px;color:rgba(255,255,255,.8)}
.ring{flex-shrink:0;position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:22px;font-weight:800;line-height:1}
.ring .v span{font-size:10px;opacity:.65}

.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--gold);color:var(--ink);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-weight:800;font-size:15px;box-shadow:0 4px 16px rgba(196,154,60,.35)}
.cta .e{font-size:24px}
.cta span{flex:1}
.cta.soft{background:#fff;border:1.5px dashed var(--gold);box-shadow:none}
.done-line{display:flex;align-items:center;gap:8px;background:var(--green-p);color:var(--green);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:14px}

.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--cream2);font-size:14px}
.line:last-child{border-bottom:none}
.line .l{flex:1}
.line .v{font-weight:800}
.ok{color:var(--green)} .no{color:var(--red)} .mu{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;margin:3px 0 3px 4px;background:var(--cream2);color:var(--muted)}
.chip.ok{background:var(--green-p);color:var(--green)}
.chip.no{background:var(--red-p);color:var(--red)}
.chip.gold{background:var(--gold-p);color:#7a5a14;border:1px solid var(--line)}
.bar{height:8px;background:var(--cream2);border-radius:5px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:5px;background:var(--gold)}
.bar i.g{background:var(--green)}
.prog{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.prog .t{width:46%;min-width:0}
.prog .n{font-weight:700;font-size:12px;width:56px;text-align:left;direction:ltr}
.note{background:var(--cream);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.note.warn{background:var(--red-p);color:var(--red)}
.days{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:6px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.days .d i{width:100%;border-radius:6px 6px 3px 3px;background:var(--gold);min-height:4px}
.days .d i.miss{background:var(--cream2)}
.days .d span{font-size:10px;color:var(--muted)}
.days .d.today span{color:var(--ink);font-weight:800}
.lb{display:flex;align-items:center;gap:10px;padding:6px 0}
.lb .av{width:30px;height:30px;font-size:13px}
.lb .nm{width:52px;font-size:13px;font-weight:700}
.lb .p{width:44px;font-size:12px;font-weight:800;text-align:left;direction:ltr}

/* forms */
.seg-title{font-size:12px;font-weight:800;color:var(--gold);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.seg-title:after{content:'';flex:1;height:1px;background:var(--line)}
.dates{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.dates button{flex:1;min-width:92px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 6px;font-size:13px;font-weight:700;line-height:1.3}
.dates button small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.dates button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dates button.on small{color:var(--gold-l)}
.dates button .tick{color:var(--green)}
.dates button.on .tick{color:var(--gold-l)}
.scorebar{position:sticky;top:64px;z-index:15;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
.scorebar b{font-size:18px;color:var(--gold-l)}
.scorebar .sp{flex:1}
.scorebar .cnt{background:rgba(255,255,255,.1);border-radius:10px;padding:2px 10px;font-size:12px}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;transition:border-color .2s}
.q.miss{border-color:var(--red);box-shadow:0 0 0 3px var(--red-p)}
.q .qh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.q .qh .e{font-size:18px}
.q .qh .sp{flex:1}
.q .qh .pt{font-size:13px;font-weight:800;border-radius:8px;padding:1px 8px;direction:ltr}
.q .hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.opt{border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.opt i{font-style:normal;font-size:11.5px;font-weight:800;opacity:.55;direction:ltr}
.opt.on.pos{background:var(--green);border-color:var(--green);color:#fff}
.opt.on.neg{background:var(--red);border-color:var(--red);color:#fff}
.opt.on.zero{background:var(--muted);border-color:var(--muted);color:#fff}
.opt.on i{opacity:.9}
.pos-t{background:var(--green-p);color:var(--green)} .neg-t{background:var(--red-p);color:var(--red)} .zero-t{background:var(--cream2);color:var(--muted)}
.stepper{display:flex;align-items:center;gap:12px;margin-top:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--cream2);font-size:22px;font-weight:800}
.stepper .num{min-width:48px;text-align:center;font-size:24px;font-weight:800}
.stepper .u{font-size:13px;color:var(--muted)}
.auto{margin-top:8px;font-size:13px;color:var(--green);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.tg{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.tg i{font-style:normal;font-size:11px;font-weight:800;color:var(--gold)}
.tg.on{background:var(--gold-p);border-color:var(--gold);color:#5f4510}
.tg.on:before{content:'✓';font-weight:800;color:var(--gold)}
.xgroup{margin-bottom:12px}
.xgroup .gl{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.xsub{margin:4px 0 6px}
.xsub .gl2{font-size:12.5px;font-weight:700;margin-bottom:5px}
.save{position:fixed;bottom:66px;left:0;right:0;display:flex;justify-content:center;padding:0 14px;z-index:25;pointer-events:none}
.save button{pointer-events:auto;width:100%;max-width:532px;background:var(--gold);color:var(--ink);font-weight:800;font-size:16px;border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(26,18,8,.2)}
.save button:disabled{opacity:.6}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--green)} .btn.no{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn.full{width:100%}
.people{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.person{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;opacity:.55}
.person .av{width:46px;height:46px;border:3px solid transparent}
.person.on{opacity:1}
.person.on .av{border-color:var(--gold);box-shadow:0 0 0 2px #fff inset}
.bh{display:flex;flex-wrap:wrap;gap:7px}
.bh .tg.neg.on{background:var(--red-p);border-color:var(--red);color:var(--red)}
.bh .tg.neg.on:before{color:var(--red)}
.bh .tg.neg i{color:var(--red)}
.bh .tg.pos i{color:var(--green)}
.bh .tg.pos.on{background:var(--green-p);border-color:var(--green);color:var(--green)}
.bh .tg.pos.on:before{color:var(--green)}
.wal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;position:relative}
.wal div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px;text-align:center}
.wal b{display:block;font-size:17px;color:#fff}
.wal span{font-size:11px;color:rgba(255,255,255,.6)}
.amt-in{color:#1D9E75}.amt-out{color:#C0392B}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--cream2);font-size:13.5px}
.item:last-child{border-bottom:none}
.item .b{flex:1;min-width:0}
.item .b small{display:block;color:var(--muted);font-size:12px}
.item .p{font-weight:800;direction:ltr}
.status{font-size:11px;font-weight:700;border-radius:8px;padding:1px 8px}
.st-pending{background:var(--amber-p);color:var(--amber)} .st-approved{background:var(--green-p);color:var(--green)} .st-rejected{background:var(--cream2);color:var(--muted);text-decoration:line-through}
.stars{display:flex;gap:4px;direction:ltr;justify-content:flex-end}
.stars button{font-size:28px;line-height:1;color:var(--cream2);transition:transform .1s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(1.2)}
.crit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--cream2)}
.crit:last-of-type{border-bottom:none}
.crit span{flex:1;font-size:14px;font-weight:600}
.org{display:flex;align-items:center;gap:12px;background:var(--gold-p);border-radius:14px;padding:12px;margin-bottom:12px}
.org .av{width:52px;height:52px;font-size:22px}
.org b{display:block;font-size:16px}
.org span{font-size:12px;color:var(--muted)}
.plan .line .l{color:var(--muted);flex:0 0 90px}
.kid{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.kid .ring{width:64px;height:64px}
.kid .ring .v b{font-size:15px}
.kid .info{flex:1;min-width:0}
.kid .info b{font-size:16px}
.kid .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kid .tags .chip{margin:0;font-size:11px;padding:1px 8px}
.kid .sar{text-align:center;font-weight:800;color:var(--gold);font-size:18px;line-height:1.1}
.kid .sar small{display:block;font-size:10px;color:var(--muted);font-weight:600}
.back{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;color:var(--muted);margin-bottom:10px}
.pay{width:100%;border-collapse:collapse;font-size:13.5px}
.pay td{padding:8px 4px;border-bottom:1px solid var(--cream2)}
.pay tr:last-child td{border-bottom:none}
.pay .amt{font-weight:800;color:var(--gold);direction:ltr;text-align:left}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:99;transition:transform .3s;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:80px 0;color:var(--muted);font-size:14px}
.spin{width:34px;height:34px;border:3px solid var(--cream2);border-top-color:var(--gold);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 18px;max-width:440px;margin:0 auto}
.login .logo{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,var(--ink),var(--ink2));display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 8px 24px rgba(26,18,8,.25)}
.login h1{font-size:26px;font-weight:800;margin-top:14px}
.login .ay{font-family:'Amiri',serif;color:var(--gold);font-size:16px;margin:2px 0 26px;text-align:center}
.login .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.login .grid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 6px;box-shadow:var(--shadow)}
.login .grid button .av{width:54px;height:54px;font-size:22px}
.pin{width:100%;text-align:center}
.pin .dots{display:flex;gap:14px;justify-content:center;margin:18px 0 22px;direction:ltr}
.pin .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);transition:background .15s}
.pin .dots i.f{background:var(--gold)}
.pin .dots.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr;max-width:300px;margin:0 auto}
.keys button{height:62px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:24px;font-weight:700;box-shadow:var(--shadow)}
.keys button:active{background:var(--gold-p)}
.keys button.fn{background:transparent;border:none;box-shadow:none;font-size:15px;color:var(--muted)}
.remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;font-size:13px;color:var(--muted)}
.av.ph{background-size:cover!important;background-position:center!important;color:transparent}
.switch{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.switch button{flex:1;padding:8px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.switch button.on{background:var(--ink);color:#fff}
.pf-photo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
.pf-photo .av{width:96px;height:96px;font-size:38px}
.msgbox{white-space:pre-wrap;background:var(--cream);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.8}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spin"></div>جارٍ التحميل…</div></div>

<script>

<script>

var DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

/* ---------- helpers ---------- */
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function sgn(n) { return n > 0 ? '+' + n : String(n); }
function cls(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero'; }
function fmtDate(ds) { var p = ds.split('-'); return DAYS[dow_(ds)] + ' ' + (+p[2]) + ' ' + MONTHS[+p[1] - 1]; }
function shortDate(ds) { var p = ds.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1] - 1]; }
function sar(n) { return (Math.round(n * 10) / 10).toString(); }
function mem(name) { return (S.boot.members.filter(function (m) { return m.name === name; })[0]) || { name: name, color: '#888' }; }
function av(name, extra) {
  var m = mem(name), ph = S.photos && S.photos[name];
  var bg = ph ? 'background:' + esc(m.color) + ' url(' + ph + ');' : 'background:' + esc(m.color) + ';';
  return '<div class="av' + (ph ? ' ph' : '') + '" style="' + bg + '"' + (extra || '') + '>' + esc(m.name.charAt(0)) + '</div>';
}
function kids() { return S.boot.members.filter(function (m) { return m.role === 'child'; }); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(msg, err) { var t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, 2600); }
function ring(pct, size, stroke, fg, bg) {
  var r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, Math.max(0, pct)) / 100);
  return '<svg width="' + size + '" height="' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + bg + '" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + fg + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/></svg>';

function loading() { return '<div class="loading"><div class="spin"></div>جارٍ التحميل…</div>'; }

function api(action, args) {
  return new Promise(function (res, rej) {
    var payload = JSON.stringify({ action: action, args: args || {}, name: S.me && S.me.name, pin: S.pin });
    if (window.API_URL) {
      var go = function () {
        fetch(window.API_URL, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })

          .then(function (j) { if (j.ok) res(j.data); else rej(new Error(j.error)); })
          .catch(function () { rej(new Error('تعذر الاتصال، تأكد من الإنترنت ثم حاول مرة أخرى')); });
      };
      return go();
    }
    google.script.run.withSuccessHandler(function (r) {
      var j = JSON.parse(r); if (j.ok) res(j.data); else rej(new Error(j.error));
    }).withFailureHandler(function (e) { rej(new Error((e && e.message) || 'تعذر الاتصال')); }).api(payload);
  });

/* ---------- boot & login ---------- */
function start() {
  api('bootstrap').then(function (b) {
    S.boot = b;
    var saved = store('fam_login');
    if (saved) { try { var o = JSON.parse(saved); S.me = mem(o.name); S.pin = o.pin; return doLogin(true); } catch (e) { } }

  }).catch(function (e) { $('#root').innerHTML = '<div class="loading">' + esc(e.message) + '</div>'; });

      '<div class="dots" id="dots">' + [0, 1, 2, 3].map(function (i) { return '<i class="' + (i < L.pin.length ? 'f' : '') + '"></i>'; }).join('') + '</div>' +
      '<div class="keys">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button onclick="key(' + n + ')">' + n + '</button>'; }).join('') +
      '<button class="fn" onclick="L.pick=null;L.pin=\'\';renderLogin()">رجوع</button><button onclick="key(0)">0</button><button class="fn" onclick="key(-1)">⌫</button></div>' +

  renderLogin();
  if (L.pin.length === 4) { S.me = mem(L.pick); S.pin = L.pin; doLogin(false); }
}
function doLogin(silent) {
  return api('login').then(function (r) {
    var me = r.me; S.me = me; S.photos = r.photos || {};
    if (!silent && L.remember) store('fam_login', JSON.stringify({ name: me.name, pin: S.pin }));
    L.pick = null; L.pin = '';
    S.tab = me.role === 'viewer' ? 'family' : 'home';
    var first = me.mustChange ? 'pin' : (!me.email && !me.phone && !store('fam_skip_' + me.name)) ? 'welcome' : '';

    if (first) viewProfile(first);

    store('fam_login', null);
    if (silent) { renderLogin(); return; }
    L.pin = ''; renderLogin(); var d = $('#dots'); if (d) d.classList.add('shake'); toast(e.message, true);

function logout() { store('fam_login', null); S.cache = {}; renderLogin(); }

/* ---------- shell ---------- */
function tabs() {
  if (S.me.role === 'viewer') return [['family', '👨‍👩‍👧‍👦', 'العائلة'], ['friday', '🍽️', 'الجمعة']];

  if (S.me.role !== 'child') t.splice(2, 0, ['family', '👨‍👩‍👧‍👦', 'الأبناء']);

  return t;
}
function renderShell(skipGo) {
  var role = S.me.role === 'admin' ? 'المشرف' : S.me.role === 'parent' ? 'ولي الأمر' : S.me.role === 'viewer' ? 'متابعة' : 'إلى رمضان 1448';

var P = { photo: undefined };

function pickPhoto(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var s = 160, c = document.createElement('canvas'); c.width = s; c.height = s;
    var k = Math.max(s / img.width, s / img.height), w = img.width * k, hh = img.height * k;
    c.getContext('2d').drawImage(img, (s - w) / 2, (s - hh) / 2, w, hh);
    var q = 0.82, d = c.toDataURL('image/jpeg', q);
    while (d.length > 40000 && q > 0.3) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
    P.photo = d; URL.revokeObjectURL(url);
    $('#pfav').innerHTML = '<div class="av ph" style="background:url(' + d + ')"></div>';
  };
  img.src = url;
}

function renderDaily() {

function qHTML(it, ds, ans, form) {

function recSwitch(cur) {

function formObj(f) { return f === 'F' ? F : W; }

];
function viewAdmin() { api('admin').then(function (d) { A.d = d; renderAdmin(); }).catch(fail); }
function renderAdmin() {
  var d = A.d, h = '<div class="fade">';
  h += '<div class="card"><h3>🔔 بانتظار الاعتماد<span class="sp"></span><small>' + d.pending.length + '</small></h3>' + (d.pending.length ? d.pending.map(function (e) {
    return '<div class="item"><div class="b"><b>' + esc(e.member) + '</b> · ' + esc(e.label) + ' <span class="' + (e.points > 0 ? 'ok' : 'no') + '" style="font-weight:800">' + sgn(e.points) + '</span><small>سجّله ' + esc(e.by) + ' · ' + shortDate(e.date) + (e.note ? ' · ' + esc(e.note) : '') + '</small></div>' +
      '<button class="btn ok sm" onclick="decide(\'' + e.id + '\',true)">اعتماد</button> <button class="btn ghost sm" onclick="decide(\'' + e.id + '\',false)">رفض</button></div>';
  }).join('') : '<div class="mu" style="font-size:13px">لا يوجد شيء بانتظارك</div>') + '</div>';
  // quick actions
  h += '<div class="card"><h3>⚡ تسجيل سريع</h3><div class="field"><label>الابن</label><div class="people">' + kids().map(function (k) {
    return '<button class="person ' + (A.member === k.name ? 'on' : '') + '" onclick="A.member=\'' + esc(k.name) + '\';renderAdmin()">' + av(k.name) + esc(k.name) + '</button>';
  }).join('') + '</div></div><div class="field"><label>النوع</label><select id="atype" onchange="A.type=this.value;renderAdmin()">' + ATYPES.map(function (t) {
    return '<option value="' + t[0] + '"' + (A.type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
  }).join('') + '</select></div>';
  if (A.type === 'test') h += '<div class="field"><label>عدد الدرجات المخصومة في الاختبار (−20 لكل درجة)</label><input id="aqty" type="number" inputmode="decimal" min="0" step="0.5"></div>';
  if (A.type === 'weight') h += '<div class="field"><label>الوزن بالكيلو (أول تسجيل = نقطة البداية)</label><input id="aqty" type="number" inputmode="decimal" step="0.1"></div>';
  if (A.type === 'cancel') h += '<div class="field"><label>الجمعة</label><select id="adate"><option value="' + d.lastFriday + '">' + fmtDate(d.lastFriday) + '</option><option value="' + d.friday + '">' + fmtDate(d.friday) + '</option></select></div>';
  if (A.type === 'waiver') h += '<div class="field"><label>الشرط المستدرَك</label><select id="aitem"><option value="cum">نسبة الإنجاز التراكمية</option><option value="month">أقل نسبة شهرية</option><option value="late">الصلاة بعد خروج الوقت</option><option value="submit">نسبة أيام التسجيل</option><option value="severe">مواقف الكذب والمضاربة</option></select></div>';
  h += '<div class="field"><label>ملاحظة (اختياري)</label><input id="anote" maxlength="200"></div><button class="btn gold full" onclick="addEvent()">تسجيل</button></div>';
  h += '<div class="card"><h3>🔐 إعادة ضبط رمز الدخول</h3><div class="field"><label>الشخص</label><div class="people">' + S.boot.members.map(function (k) {
    return '<button class="person ' + (A.reset === k.name ? 'on' : '') + '" onclick="A.reset=\'' + esc(k.name) + '\';A.rres=null;renderAdmin()">' + av(k.name) + esc(k.name) + '</button>';
  }).join('') + '</div></div>' +
    '<label class="remember" style="justify-content:flex-start;margin:0 0 10px"><input type="checkbox" id="remail" checked> إرسال الرمز المؤقت إلى إيميله (إن وُجد)</label>' +
    '<button class="btn full" onclick="resetPin()">إنشاء رمز مؤقت</button>';
  if (A.rres) {
    var x = A.rres;
    h += '<div style="margin-top:12px"><div class="line"><span class="l">الرمز المؤقت لـ ' + esc(x.member) + '</span><span class="v" style="font-size:20px;letter-spacing:3px">' + esc(x.pin) + '</span></div>' +
      '<div class="line"><span class="l">الإيميل</span><span class="v ' + (x.emailed ? 'ok' : 'mu') + '">' + (x.emailed ? '✓ أُرسل إلى ' + esc(x.email) : x.emailError ? 'تعذّر الإرسال' : x.email ? 'لم يُرسل' : 'لا يوجد إيميل مسجّل') + '</span></div>' +
      '<div class="msgbox" style="margin:10px 0">' + esc(x.message) + '</div>' +
      (x.wa ? '<a class="btn ok full" target="_blank" href="https://wa.me/' + esc(x.wa) + '?text=' + encodeURIComponent(x.message) + '">إرسال عبر واتساب</a>' : '<div class="note">لا يوجد جوال مسجّل. انسخ الرسالة وأرسلها يدوياً.</div>') +
      '<button class="btn ghost full" style="margin-top:8px" onclick="copyMsg()">نسخ الرسالة</button></div>';
  }
  h += '</div>';
  // payouts
  d.payouts.forEach(function (blk) {
    if (!blk.rows.length) return;
    h += '<div class="card"><h3>💵 ' + esc(blk.title) + '<span class="sp"></span><small>' + (blk.kind === 'week' ? shortDate(blk.period) : blk.period) + '</small></h3><table class="pay">' + blk.rows.map(function (r) {
      var det = blk.kind === 'week' ? ('توفير ' + r.detail.savings + ' · إنجاز ' + r.detail.perf + ' (' + Math.round(r.detail.pct) + '%) · شارات ' + sar(r.detail.badgeSAR) + (r.detail.gated ? ' · سقط بسبب سلوك' : ''))
        : ('نسبة ' + r.detail.pctSAR + ' (' + Math.round(r.detail.pct) + '%) · نجم ' + r.detail.star + ' · إنجازات ' + r.detail.achSAR);
      var total = blk.kind === 'week' ? r.amount + RULES.incentives.weekly.allowance : r.amount;
      return '<tr><td>' + av(r.member, ' style="width:28px;height:28px;font-size:12px;background:' + esc(mem(r.member).color) + '"') + '</td><td><b>' + esc(r.member) + '</b><br><small class="mu">' + det + '</small></td><td class="amt">' + sar(total) + '</td><td>' +
        (r.paid ? '<button class="btn ghost sm ok" onclick="pay(\'' + blk.kind + '\',\'' + blk.period + '\',\'' + esc(r.member) + '\',' + total + ',true)">✓ صُرف</button>'
          : '<button class="btn sm" onclick="pay(\'' + blk.kind + '\',\'' + blk.period + '\',\'' + esc(r.member) + '\',' + total + ')">صرف</button>') + '</td></tr>';
    }).join('') + '</table>' + (blk.kind === 'week' ? '<div class="note">المبلغ = المصروف 25 + البونص</div>' : '') + '</div>';
  });
  var TL = {}; ATYPES.forEach(function (t) { TL[t[0]] = t[1]; });
  if (d.recent.length) h += '<div class="card"><h3>🕘 آخر التسجيلات</h3>' + d.recent.map(function (e) {
    return '<div class="item"><div class="b"><b>' + esc(e.member) + '</b> · ' + esc(TL[e.type] || e.type) + (e.qty ? ' (' + e.qty + ')' : '') + '<small>' + esc(e.createdAt) + ' <span class="status st-' + e.status + '">' + (e.status === 'rejected' ? 'محذوف' : 'معتمد') + '</span></small></div><span class="p">' + (e.points ? sgn(e.points) : '') + '</span>' +
      (e.status === 'approved' ? ' <button class="btn ghost sm" onclick="removeEvent(\'' + e.id + '\')">حذف</button>' : '') + '</div>';
  }).join('') + '</div>';
  $('#main').innerHTML = h + '</div>';
}
function decide(id, ok) { api('decide', { id: id, approve: ok }).then(function () { toast(ok ? '✓ اعتُمد' : 'رُفض'); viewAdmin(); }).catch(function (e) { toast(e.message, true); }); }
function addEvent() {
  if (!A.member) return toast('اختر الابن', true);
  var a = { member: A.member, type: A.type, note: $('#anote').value };
  var q = $('#aqty'); if (q) a.qty = q.value;
  var dt = $('#adate'); if (dt) a.date = dt.value;
  var it = $('#aitem'); if (it) a.item = it.value;
  api('addEvent', a).then(function (r) { toast('✓ سُجّل' + (r && r.points ? ' · ' + sgn(r.points) : '')); viewAdmin(); }).catch(function (e) { toast(e.message, true); });
}
function resetPin() {
  if (!A.reset) return toast('اختر الشخص', true);
  api('resetPin', { member: A.reset, email: $('#remail').checked }).then(function (r) { A.rres = r; renderAdmin(); toast('✓ أُنشئ رمز مؤقت'); }).catch(function (e) { toast(e.message, true); });
}
function copyMsg() {
  var t = A.rres && A.rres.message; if (!t) return;
  try { navigator.clipboard.writeText(t).then(function () { toast('✓ نُسخت الرسالة'); }, function () { toast('انسخ الرسالة يدوياً', true); }); } catch (e) { toast('انسخ الرسالة يدوياً', true); }
}
function removeEvent(id) { api('removeEvent', { id: id }).then(function () { toast('حُذف'); viewAdmin(); }).catch(function (e) { toast(e.message, true); }); }
function pay(kind, period, member, amount, unpay) { api('markPaid', { kind: kind, period: period, member: member, amount: amount, unpay: !!unpay }).then(function () { toast(unpay ? 'أُلغي الصرف' : '✓ سُجّل الصرف'); viewAdmin(); }).catch(function (e) { toast(e.message, true); }); }

start();
</script>
</body>
</html>
